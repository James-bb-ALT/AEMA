plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'org.aema.capture'
    compileSdk 35
    defaultConfig {
        applicationId 'org.aema.capture'
        minSdk 26
        targetSdk 35
        versionCode 10000
        versionName '1.0.0'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { aidl true; buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('AEMA_KEYSTORE')) {
                signingConfig signingConfigs.create('localRelease') {
                    storeFile file(System.getenv('AEMA_KEYSTORE'))
                    storePassword System.getenv('AEMA_STORE_PASSWORD')
                    keyAlias 'aema'
                    keyPassword System.getenv('AEMA_STORE_PASSWORD')
                }
            }
        }
    }
    // The same sources used by pytest on the host; no second parser implementation.
    sourceSets { androidTest.assets.srcDir '../../tests/fixtures' }
    testOptions { unitTests.returnDefaultValues = true }
}

chaquopy {
    defaultConfig {
        version = '3.13'
        // Android wheels currently provide pandas 2.1.3. Host dependencies stay intact.
        pip { install 'pandas==2.1.3' }
    }
    sourceSets { main { srcDir '../../src' } }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
